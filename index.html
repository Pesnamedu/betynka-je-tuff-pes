<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>My Page</title>
  </head>
    <body class="text-center">

      <h1 class="text-4xl font-bold text-slate-500">Betynka je tuff pes</h1>
      <p class="text-slate-600">Betynka má ráda kostičky</p>

      <div id="scoredisplay" class="text-4xl font-extrabold text-slate-700 mb-4">0</div>

      <button id="plusone"
              class="transition-transform duration-100 active:scale-90 hower:scale-110 focus:outline-none cursor-pointer">

        <img src="https://yumove.co.uk/cdn/shop/files/Dachshund.jpg?v=1749573704&width=550"
             alt="Pes co vypadá jako betyna"
             width="300"
             class="rounded-3xl shadow-lg">
      </button>

      <script>
        let score = 0;
        const textScore = document.getElementById("scoredisplay");
        const clickButton = document.getElementById("plusone");

        clickButton.addEventListener("click", () => {
          score = score + 1;
          textScore.textContent = score;

        })
      </script>
    </body>

</html>
